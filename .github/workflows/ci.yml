name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware-rank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hardware-rank/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Check prerender output
        run: test -f dist/rank/cpu.html && test -f dist/sitemap.xml
